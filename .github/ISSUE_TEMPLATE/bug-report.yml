name: Bug Report
description: Report an issue with the orchestrator, a Transformation Definition, an example report, or the docs
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. If instead you want to **propose a rubric/scoring change** to a
        managed Transformation Definition, use the **Rubric / scoring change** template — it routes
        you to the contributor guide. Note the change-impact harness runs on **GitLab only**; a
        GitHub issue/PR gets human review but no automated harness verdict.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? What did you expect to happen?
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - "Orchestrator (orchestrator/SKILL.md / references)"
        - "Transformation Definition (ARA / MOD / portfolio rubric)"
        - "Change-impact harness (scoring, diff, judge)"
        - "Example reports"
        - "Portfolio config schema"
        - "Documentation (README / docs/contributing)"
        - "Other"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce the issue?
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: "atx CLI version, OS, and anything unusual about your setup"
    validations:
      required: false
