name: Feature Request
description: Suggest an improvement to the orchestrator, harness, or documentation
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Proposing a change to what a rubric **scores** (add/remove/re-score a question, a pathway,
        a program)? Use the **Rubric / scoring change** template instead — it routes you to the
        contributor guide and the invariants that matter.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What would you like to see improved or added?
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - "Orchestrator workflow"
        - "Change-impact harness / CI"
        - "Portfolio config options"
        - "Report examples"
        - "Documentation"
        - "Other"
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: What problem does this solve? How would you use it?
    validations:
      required: true
