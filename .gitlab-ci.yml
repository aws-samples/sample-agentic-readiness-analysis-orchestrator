# =============================================================================
# Change-Impact Harness — GitLab CI   (see harness/DESIGN.md §5, §6, §8)
#
# AUTOMATION IS GITLAB-ONLY. GitHub carries NO Actions/workflows — it stays open
# for issues/PRs and mirrors content both ways, but runs nothing. All analysis
# runs here on gitlab.aws.dev.
#
# AWS AUTH = AWS CREDENTIAL VENDOR (no long-lived credentials, no OIDC).
# OIDC is NOT available on the internal GitLab instance: AWS IAM cannot reach the
# private instance to verify an id_token, so the OIDC provider trust model does
# not work here. Instead the SHARED RUNNER FLEET vends temporary credentials via
# the AWS Credential Vendor: the runners' jump role assumes a role that YOU create
# in your own AWS account, gated by GitLab principal tags
# (aws:PrincipalTag/GitLab:Project + :Group). You set ONE CI variable,
# AWS_CREDS_TARGET_ROLE = that role's ARN, and the shared runner injects
# AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / AWS_SESSION_TOKEN into the job
# automatically — there is NOTHING to exchange in before_script.
# See harness/README.md for the one-time role setup (it has the jump-role ARN you
# need for the trust policy).
#
# Requirements (both already in place):
#   - SHARED runners enabled (the Credential Vendor only works on shared runners).
#   - The role is created PER-PROJECT (it cannot be reused across projects).
#
# Both jobs are ADVISORY (allow_failure: true) — the harness NEVER blocks a merge.
# The only LLM call is the judge step, spent at the very end (§6). The run|skip
# decision is a deterministic git-diff gate (should-run.sh), not a model (§5).
# =============================================================================

stages:
  - gate      # deterministic run|skip decision (harness/should-run.sh) — no LLM
  - test      # offline, no-AWS: schema-guardrail contract tests (fast, always runs)
  - analyze   # atx re-run of changed fixtures + D1–D5 delta -> impact.json
  - judge     # LLM-as-judge advisory verdict -> verdict.json, posted to the MR
# NOTE: harness:impact and harness:full each run the gate -> analyze -> judge
# phases INLINE as a single advisory job. The stage list above names those
# phases and reserves structure for a future per-stage split.

variables:
  # AWS_CREDS_TARGET_ROLE is deliberately NOT set here. It lives as a project CI/CD
  # variable (Settings -> CI/CD -> Variables) because it names an AWS account id +
  # role, and this repo is mirrored to the public GitHub aws-samples org. An ARN is
  # not a credential, but it should not be published there.
  #
  # It MUST stay PLAIN (Expanded, not Masked/Hidden, not Protected):
  #   - "Protected" is only injected on protected branches, silently breaking the
  #     vend on feature branches and MRs — the exact failure we hit before.
  #   - "Masked"/"Hidden" cannot be read by the runner's pre-clone vendor script at
  #     all, so no credentials are vended.
  # Run the manual harness:auth-check job to diagnose either case: it prints the
  # variable's LENGTH (never its value) and whether creds were injected.
  #
  # REQUIRED for the vend: the runner's pre-clone aws-creds-vendor.sh only vends
  # when BOTH AWS_CREDS_TARGET_ROLE *and* AWS_DEFAULT_REGION are set. It gates on
  # AWS_DEFAULT_REGION specifically (NOT AWS_REGION) — leaving it unset makes the
  # vendor silently skip, so no creds are injected (confirmed: zero AssumeRole
  # attempts in the target account's CloudTrail). Every working example sets it.
  AWS_DEFAULT_REGION: "us-east-1"
  # Where run-fixtures.sh writes the freshly-generated "after" reports (§7).
  AFTER_DIR: "harness/after"
  # Bedrock model for the LLM judge. MUST be a cross-region INFERENCE PROFILE id
  # (the "global."/"us." prefixed ids from `aws bedrock list-inference-profiles`),
  # NOT a bare foundation-model id — invoke_model rejects the bare id with
  # "The provided model identifier is invalid." Must be ACTIVE in the target
  # account / us-east-1. judge.py reads this via HARNESS_JUDGE_MODEL; if the
  # call fails for any reason the judge falls back to the offline heuristic.
  HARNESS_JUDGE_MODEL: "global.anthropic.claude-opus-4-5-20251101-v1:0"
  # pip cache location (see cache: block below).
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  # --- COST / WALL-CLOCK CONTROLS (see harness/run-fixtures.sh header) ---------
  # Each (fixture, analysis) unit bills ~110-130 AGENT-minutes (internal compute; the
  # observed WALL-CLOCK is ~10-20 min per unit, and units run concurrently). Two knobs
  # keep an MR at ~20 min instead of a 22-unit sweep:
  #
  # HARNESS_MR_FIXTURES — how many fixtures the changed-only path selects. The
  # selector (select-fixtures.py) picks the ones whose declared expectations
  # actually exercise the EDITED rubric questions, so 1-2 is enough to observe a
  # change; breadth is what harness:full is for. A portfolio-TD edit auto-floors
  # this to 2 (a rollup over one repo exercises nothing).
  HARNESS_MR_FIXTURES: "2"
  # HARNESS_JOBS — concurrent atx execs. Safe because every unit gets its own
  # staged copy of the fixture with its own `git init` (atx switches branches in
  # the repo enclosing its -p target, so the invariant is "never two execs in ONE
  # repo", not "never two at once"). Each exec is Bedrock-bound, not CPU-bound.
  HARNESS_JOBS: "4"

default:
  image: python:3.13-slim
  # No `tags:` — AWS GitLab has no tag literally named "shared". Untagged jobs are
  # auto-picked-up by the default shared fleet (t-shirt sizes like amd64-small /
  # amd64-medium are opt-in via tags; add one only if a job needs more CPU/RAM).
  # The AWS Credential Vendor runs on this default shared fleet.
  cache:
    key: "harness-pip-$CI_COMMIT_REF_SLUG"
    paths:
      - .cache/pip
  before_script:
    # The slim image ships without curl/git/unzip — install what the harness needs.
    # unzip is REQUIRED: the atx CLI installer unpacks a zip and hard-fails without it.
    # xz-utils is REQUIRED for `tar -J` when unpacking the Node tarball below.
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends curl git unzip xz-utils ca-certificates
    # --- NODE RUNTIME — REQUIRED by the atx CLI ---------------------------------
    # The installed `atx` is a Node script (`#!/usr/bin/env node`), so on this
    # python-only image every atx call dies with:
    #   env: 'node': No such file or directory
    # README documents Node.js 22+ as a prerequisite. We install the official
    # pinned tarball rather than the NodeSource apt repo: no third-party apt
    # source and no gnupg dependency (the slim image ships neither).
    - |
      NODE_VERSION=22.14.0
      case "$(dpkg --print-architecture)" in
        amd64) NODE_ARCH=x64 ;;
        arm64) NODE_ARCH=arm64 ;;
        *) echo "unsupported runner arch: $(dpkg --print-architecture)" >&2; exit 1 ;;
      esac
      curl -fsSL "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-${NODE_ARCH}.tar.xz" -o /tmp/node.tar.xz
      tar -xJf /tmp/node.tar.xz -C /usr/local --strip-components=1
      rm -f /tmp/node.tar.xz
      node --version
    # AWS CLI (to sanity-check the vended identity) + atx CLI (drives the managed TDs).
    - pip install --quiet --cache-dir "$PIP_CACHE_DIR" awscli
    - curl -fsSL https://transform-cli.awsstatic.com/install.sh | bash
    - export PATH="$HOME/.local/bin:$PATH"
    # Surface atx's location here rather than failing deep inside run-fixtures.sh.
    # NOTE: block scalar (|) is required — an inline `- foo: bar` style string
    # containing ": " parses as a YAML MAPPING, and GitLab then rejects
    # before_script with "config should be a string or a nested array of strings".
    - |
      if command -v atx >/dev/null; then
        echo "atx installed at $(command -v atx)"
      else
        echo "WARN: atx not on PATH" >&2
      fi
    # Region falls back to us-east-1 if the AWS_REGION CI variable is unset.
    - export AWS_REGION="${AWS_REGION:-us-east-1}"
    # --- AWS Credential Vendor -------------------------------------------------
    # No token exchange here. When AWS_CREDS_TARGET_ROLE + AWS_DEFAULT_REGION are set,
    # the shared runner's pre-clone script has ALREADY vended temporary creds into the
    # default AWS profile (~/.aws/credentials — NOT env vars) before this script runs.
    # We just confirm the identity so a missing/rejected role fails loudly with a
    # useful message instead of deep inside atx.
    - |
      if [ -z "${AWS_CREDS_TARGET_ROLE:-}" ]; then
        echo "WARN: AWS_CREDS_TARGET_ROLE is unset — no AWS creds were vended." >&2
        echo "      Set it in .gitlab-ci.yml variables: (see harness/README.md)." >&2
      else
        aws sts get-caller-identity >/dev/null 2>&1 \
          && echo "AWS Credential Vendor: creds vended for role ${AWS_CREDS_TARGET_ROLE}" \
          || echo "WARN: creds not usable yet (check the role trust policy / project tags)." >&2
      fi
    # Python deps for the differ / judge (guarded — file is optional).
    - if [ -f harness/requirements.txt ]; then pip install --quiet --cache-dir "$PIP_CACHE_DIR" -r harness/requirements.txt; fi

# -----------------------------------------------------------------------------
# Entry 0 — harness:auth-check   (manual; one-time wiring verification)
# Cheap smoke test that proves ONLY that the AWS Credential Vendor vended usable
# creds — no atx, no fixtures, no baselines. Overrides before_script so it does
# not install the atx CLI. Run it from CI/CD → Run pipeline, or add ?var to a push.
# Delete this job once the first real pipeline is green.
# -----------------------------------------------------------------------------
harness:auth-check:
  stage: gate
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends curl ca-certificates
    - pip install --quiet --cache-dir "$PIP_CACHE_DIR" awscli
  script:
    - |
      if [ -z "${AWS_CREDS_TARGET_ROLE:-}" ]; then
        # A FORK merge request runs in the fork's OWN project, which cannot see this
        # parent-project CI/CD variable — that is GitLab's secret firewall, not a
        # misconfiguration a contributor can fix. Detect that case (source project id
        # differs from the target project id), explain how to get the full harness, and
        # pass GREEN so a fork contributor is not greeted by a red pipeline.
        if [ -n "${CI_MERGE_REQUEST_SOURCE_PROJECT_ID:-}" ] && \
           [ "${CI_MERGE_REQUEST_SOURCE_PROJECT_ID:-}" != "${CI_MERGE_REQUEST_PROJECT_ID:-}" ]; then
          echo "NOTE: this merge request is from a FORK, so the AWS credential-vendor role"
          echo "      (AWS_CREDS_TARGET_ROLE) is intentionally not available here — GitLab does"
          echo "      not hand a fork's pipeline the parent project's secrets. This is expected;"
          echo "      it is NOT a failure you can fix from the fork."
          echo ""
          echo "      The offline contract tests still ran (see harness:contract-tests) and are"
          echo "      the quality gate. The FULL change-impact analysis (atx re-run + judge"
          echo "      verdict) needs those credentials, so it WAITS for a project DEVELOPER to"
          echo "      trigger it in the parent project:"
          echo "          MR  ->  Pipelines tab  ->  Run pipeline   (accept the one-time warning)"
          echo ""
          echo "      Anyone can request Developer access to run it themselves — with that access"
          echo "      you can press Run pipeline on your own MR, or push your branch directly to"
          echo "      this repo (no fork) and the whole harness runs automatically. See"
          echo "      CONTRIBUTING.md -> 'Opening from a GitLab fork'."
          exit 0
        fi
        # NOT a fork: the variable really should be here. Fail loudly — this is exactly
        # the misconfiguration auth-check exists to catch (Protected var on an unprotected
        # branch, a Masked/Hidden var the vendor cannot read, or the var simply unset).
        echo "FAIL: AWS_CREDS_TARGET_ROLE is unset — the variable is not reaching this job." >&2
        echo "      (Is it Protected while the branch is not? Is the branch tag/name matched?)" >&2
        exit 1
      fi
      # Print only the LENGTH of the role var — masked/hidden vars print as [MASKED],
      # so length confirms it resolved to a real (non-empty) ARN inside the job.
      echo "AWS_CREDS_TARGET_ROLE length = ${#AWS_CREDS_TARGET_ROLE} chars"
      # AWS_DEFAULT_REGION is the one the vendor GATES on; AWS_REGION is only what the
      # aws CLI reads. Print both — if AWS_DEFAULT_REGION is empty the vend was skipped
      # before this script ever ran, regardless of what AWS_REGION says.
      echo "AWS_DEFAULT_REGION (gates vend) = ${AWS_DEFAULT_REGION:-<UNSET — vend skipped>}"
      echo "AWS_REGION         (cli only)   = ${AWS_REGION:-<unset>}"
      # Did the runner's Credential Vendor actually inject creds *before* this script?
      # If these are empty, the VEND never happened (usually: the var is masked/hidden,
      # or this isn't the shared fleet). If they're set but get-caller-identity fails,
      # the vend ran but the target role's trust policy rejected the AssumeRole.
      echo "--- vended credential env (presence only, never the secret) ---"
      echo "AWS_ACCESS_KEY_ID set?     $([ -n "${AWS_ACCESS_KEY_ID:-}" ] && echo yes || echo NO)"
      echo "AWS_SESSION_TOKEN set?     $([ -n "${AWS_SESSION_TOKEN:-}" ] && echo yes || echo NO)"
      echo "AWS_ROLE_ARN set?          $([ -n "${AWS_ROLE_ARN:-}" ] && echo yes || echo NO)"
      echo "--- aws sts get-caller-identity ---"
      if aws sts get-caller-identity; then
        echo "OK: Credential Vendor vended usable credentials."
      else
        echo "" >&2
        echo "DIAGNOSIS:" >&2
        if [ -z "${AWS_ACCESS_KEY_ID:-}" ]; then
          echo "  No creds were injected -> the VEND did not run. Most likely the" >&2
          echo "  AWS_CREDS_TARGET_ROLE variable is Masked/Hidden/Protected. Re-create" >&2
          echo "  it as a PLAIN (unmasked, unhidden, unprotected) variable — the vendor" >&2
          echo "  script cannot read a masked value, and Protected is only injected on" >&2
          echo "  protected branches (so MRs from feature branches get nothing)." >&2
        else
          echo "  Creds WERE injected but STS rejected them -> the target role's trust" >&2
          echo "  policy did not allow the vendor's AssumeRole. Confirm the trust policy" >&2
          echo "  on the target role names the GitLab runner jump role as principal" >&2
          echo "  (ARN is in harness/README.md) with conditions" >&2
          echo "  GitLab:Project=<project> and GitLab:Group=<group> matching this repo." >&2
        fi
        exit 1
      fi
  allow_failure: true   # advisory — a red auth-check must not block anything

# -----------------------------------------------------------------------------
# Entry 0b — harness:comment-check   (manual; MR-comment wiring verification)
# Proves ONLY that the advisory MR note can actually be POSTED. No atx, no AWS, no
# Bedrock, no fixtures — it feeds post-mr-comment.sh a CANNED verdict.json and posts
# it. ~30 seconds instead of the ~20 minutes (and ~130 agent-minutes) a full
# harness:impact run costs to reach the same 3 seconds of code.
#
# WHY THIS EXISTS: the comment is the LAST step of the most expensive job in the repo,
# so every iteration on a posting bug otherwise costs a full analysis run. MR !14 burned
# two of them on what turned out to be an auth-header bug.
#
# Run it from CI/CD -> Run pipeline (web), or let it appear as a MANUAL job on an MR and
# press play. It is `when: manual` on MRs so it does not post a junk comment on every
# push — but note the comment it posts IS visible on the MR, tagged as a wiring test.
# Delete this job once the comment path is proven.
# -----------------------------------------------------------------------------
harness:comment-check:
  stage: gate
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true
  before_script:
    # Only curl is needed — this job posts a note via the API and never touches the repo.
    # Skipping the Node/atx/awscli install is most of why this is fast. (The comment here
    # used to claim "curl + git"; git was never in the apt line and never used. If you add
    # a step that shells out to git, add the package too — see harness:contract-tests.)
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends curl ca-certificates
  script:
    - |
      echo "--- token presence (never the value) ---"
      # A masked variable prints as [MASKED], so length is the only safe signal that it
      # resolved to something real inside the job.
      if [ -n "${HARNESS_MR_TOKEN:-}" ]; then
        echo "HARNESS_MR_TOKEN: set, ${#HARNESS_MR_TOKEN} chars"
      else
        echo "HARNESS_MR_TOKEN: NOT SET -> the note WILL 401." >&2
        echo "  CI_JOB_TOKEN cannot create MR notes (GitLab excludes /notes from its" >&2
        echo "  allowlist), so this is the variable that matters. Settings -> CI/CD ->" >&2
        echo "  Variables: Project Access Token with 'api' scope, Reporter or above." >&2
        echo "  Masked is fine. Protected must be OFF (MRs run on unprotected branches)." >&2
      fi
      echo "CI_MERGE_REQUEST_IID: ${CI_MERGE_REQUEST_IID:-(none - not an MR pipeline)}"
      echo "CI_API_V4_URL:        ${CI_API_V4_URL:-(unset)}"
    # Canned verdict — shaped like a real one so the RENDERER is exercised too (scoped-run
    # disclosure, delta highlights, concerns), not just the HTTP call.
    #
    # It MUST carry `scored`, `score` AND `baseline_score` on the real 0.0-1.0 scale:
    # post-mr-comment.sh only renders the accuracy cell when all three are present and
    # numeric, so a payload missing them (or carrying a retired 0-100 `score: 85`) makes
    # this job green-light a comment reading "Accuracy: not measured" — i.e. it would pass
    # while the scored branch it exists to prove was never executed.
    - |
      cat > verdict.json <<'JSON'
      {
        "score": 0.842,
        "baseline_score": 0.815,
        "scored": true,
        "analysis_effect": "improves",
        "verdict": "LGTM",
        "intent_match": "aligned",
        "quality_regression": false,
        "rationale": "**This is a wiring test, not a real verdict.** It was posted by `harness:comment-check` with a canned payload to prove the harness can comment on an MR. No fixtures were analyzed and no rubric was evaluated.",
        "concerns": [
          {"dimension": "D1", "detail": "example concern — renders the concerns block"}
        ],
        "suggestions": ["example suggestion — renders the suggestions block"],
        "_engine": "canned (comment-check)",
        "_impact_summary": {
          "dimensions_moved": ["D1"],
          "changed_tds": ["agentic-readiness-analysis"],
          "highlights": [
            "[legacy-helpdesk-tickets] D1 reseveritied: API-Q2 RISK-QUALITY -> RISK-SAFETY",
            "[legacy-loan-calculator] D1 reseveritied: API-Q2 RISK-QUALITY -> RISK-SAFETY"
          ],
          "coverage": {"compared": 2, "baseline_total": 28, "partial": true, "not_analyzed_count": 26, "unbaselined": []}
        }
      }
      JSON
      echo "--- posting ---"
      # `|| true`: on a web pipeline there is no MR, so post-mr-comment.sh takes its
      # print-instead-of-post path and exit 1 (by design, so the harness:full caller can
      # fall back to `cat verdict.json`). That exit code is NOT this job's assertion — the
      # verify step below is (see the note there). Without this guard every web-triggered
      # pipeline (e.g. a rebaseline run) red-fails comment-check on the no-MR no-op.
      harness/post-mr-comment.sh verdict.json || true
    # post-mr-comment.sh is advisory and exits 0 even on a failed POST, so its exit code
    # cannot be the assertion. Re-read the MR's notes and confirm ours is actually there —
    # otherwise this job would go green while posting nothing, which is the exact failure
    # it exists to catch.
    - |
      if [ -z "${CI_MERGE_REQUEST_IID:-}" ]; then
        echo "no MR context (web pipeline) — POST not attempted; nothing to verify." >&2
        exit 0
      fi
      if [ -z "${HARNESS_MR_TOKEN:-}" ]; then
        echo "no HARNESS_MR_TOKEN — cannot read notes back to verify." >&2
        exit 1
      fi
      # `|| echo 000` would APPEND to the captured -w output ("000000"), so branch on
      # curl's exit status instead and synthesize a code only when there is no HTTP reply.
      rm -f notes.json
      if code="$(curl -sS -o notes.json -w '%{http_code}' \
           --connect-timeout 10 --max-time 30 \
           --header "PRIVATE-TOKEN: ${HARNESS_MR_TOKEN}" \
           "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${CI_MERGE_REQUEST_IID}/notes?per_page=20&sort=desc")"; then
        :
      else
        code="000"
      fi
      echo "GET notes -> HTTP ${code:-000}"
      if [ "${code}" != "200" ]; then
        echo "VERIFY FAILED: could not read notes back (HTTP ${code})." >&2
        [ -s notes.json ] && head -c 500 notes.json >&2
        exit 1
      fi
      python3 - <<'PY'
      import json, sys
      notes = json.load(open("notes.json"))
      ours = [n for n in notes if "comment-check" in (n.get("body") or "")
              or "wiring test" in (n.get("body") or "")]
      if ours:
          n = ours[0]
          print(f"VERIFIED: note id={n.get('id')} by "
                f"{(n.get('author') or {}).get('username')} at {n.get('created_at')}")
          sys.exit(0)
      print("VERIFY FAILED: the POST reported success but no matching note is on the MR.",
            file=sys.stderr)
      print(f"  {len(notes)} recent note(s) found, none ours.", file=sys.stderr)
      sys.exit(1)
      PY
  artifacts:
    when: always
    paths:
      - verdict.json
    expire_in: 7 days
  allow_failure: true   # advisory — a red wiring check must not block anything

# -----------------------------------------------------------------------------
# Schema guardrail — harness:contract-tests   (offline, no AWS, fast)
# The STRUCTURAL axis (distinct from the semantic judge): validate-contract.py's
# offline shape-fixture suite proves the contract validator rejects drifted JSON
# and accepts conforming JSON. No atx, no creds, no fixtures re-run — so it runs on
# EVERY MR regardless of the gate, and fails loudly if the contract logic breaks.
# before_script is overridden to skip the atx/awscli install (none needed here).
# -----------------------------------------------------------------------------
harness:contract-tests:
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  before_script:
    # git is REQUIRED, not optional: test_fixtures_integrity.py asserts against
    # `git ls-files` rather than the filesystem, because the regression it pins (a bare
    # `services/` .gitignore entry swallowing a fixture's only unsafe-code file) is
    # INVISIBLE on disk. The runner clones via a separate helper image, so the job
    # container itself has no git — this override skips the default before_script's
    # atx/Node install, and for a while it skipped the `apt-get install git` with it.
    # Those 3 tests then died on FileNotFoundError: 'git' and allow_failure: true hid it,
    # so the fixture-integrity axis was never actually running in CI.
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git
    - if [ -f harness/requirements.txt ]; then pip install --quiet --cache-dir "$PIP_CACHE_DIR" -r harness/requirements.txt; fi
  script:
    # Contract guard + differ + envelope normalizer + the SKILL.md severity-table parse
    # (test_skill_table.py asserts 43/37 and AUTH-Q5's class). The parse is what tells the
    # differ a BLOCKER->RISK-SAFETY move is a correction, so a TD heading-format change that
    # broke it would silently disable over-escalation detection — the tests catch that here.
    - python3 -m pytest harness/tests/ -q
  allow_failure: true   # advisory — surfaces contract drift without blocking the merge

# -----------------------------------------------------------------------------
# Entry 1 — harness:impact   (automatic on every merge request)
# Gate -> run changed fixtures -> diff vs golden -> judge vs MR intent -> comment.
# -----------------------------------------------------------------------------
harness:impact:
  stage: analyze
  rules:
    # Gate on the credential-vendor role actually being present in THIS pipeline. A fork's
    # detached MR pipeline runs in the fork and cannot see this parent-project variable, so
    # this job is simply NOT created there — no red "impact" a fork contributor can't fix.
    # It appears the instant the MR is run in the parent project (MR -> Pipelines -> Run
    # pipeline), where the vend resolves. Internal same-project MRs always have it, so they
    # are unaffected. (A truthy bare "$VAR" rule = defined and non-empty.)
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $AWS_CREDS_TARGET_ROLE'
  # A single (fixture, analysis) unit costs ~108 agent-min, and HARNESS_JOBS runs the
  # MR's 2 units concurrently — so wall-clock is ~one unit, ~2h with install + judge.
  # GitLab's 1h DEFAULT would kill every MR run mid-sweep, discarding the analysis and
  # reporting nothing. 3h leaves headroom for a slow unit without letting a wedged atx
  # exec burn a runner all day.
  timeout: 3h
  # Self-heal from a sister-runner death, NOT from our own failures. A single unit costs
  # ~100-130 agent-min, so a runner reclaim/eviction at (say) the portfolio stage discards
  # a ~2h sweep and reports nothing. Retry ONLY the infra classes: runner_system_failure
  # (pod killed / "system failure: aborted") and stuck_or_timeout_failure. A real script,
  # contract, or rubric fault is script_failure — NOT listed here — so it never silently
  # re-runs and never hides a genuine defect behind a second attempt.
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  script:
    # GATE (deterministic, no LLM): exit cleanly as a SKIP when the whole diff is
    # denylisted (docs / license / images / DESIGN.md). Permissive by default (§5).
    - |
      harness/should-run.sh || { echo "skip - no analysis-affecting change"; exit 0; }
    # ANALYZE: re-run only the fixtures that exercise the edit, then compute the delta.
    # --validate: contract-check each collected report as it lands (schema guardrail).
    # --jobs/--mr-fixtures: see the HARNESS_JOBS / HARNESS_MR_FIXTURES notes above.
    - harness/run-fixtures.sh --changed-only --validate --jobs "$HARNESS_JOBS" --mr-fixtures "$HARNESS_MR_FIXTURES"
    # SEVERITY GATE INPUT: which questions had their DOCUMENTED severity edited in this MR.
    # The differ reads the working-tree SKILL.md to decide whether a lost BLOCKER was an
    # "over-escalation correction" (the report was wrong, the table was right). If the SAME
    # MR moved that table row, that premise is gone — so these qids are barred from the
    # exemption and a downgrade on them alerts as a real relaxation. should-run.sh already
    # fetched the target branch, so origin/<target> resolves here. Advisory: never fatal.
    - |
      SEV_BASE="${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:+origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME}"
      python3 harness/skill_table.py --base "${SEV_BASE:-origin/main}" -o changed-severity.json || echo '{}' > changed-severity.json
    - harness/diff-reports.py --baseline harness/golden --after "$AFTER_DIR" --changed-severity changed-severity.json -o impact.json
    # SCORE + JUDGE + REPORT run in the SEPARATE harness:judge job (stage: judge), NOT
    # here. WHY THE SPLIT: the AWS creds are vended by the shared runner's pre-clone
    # script and, because the runner assumes our role via ROLE CHAINING, AWS hard-caps
    # that session at 1 HOUR regardless of the role's MaxSessionDuration. A single
    # (fixture, analysis) unit's atx exec can eat most of that hour, so the Bedrock
    # scoring/judge step that used to run here failed with ExpiredTokenException and the
    # verdict silently degraded to the offline heuristic. Moving score/judge into its own
    # job gives THAT job its own fresh pre-clone vend (a new 1h token), and scoring is a
    # few seconds of Bedrock calls, so it comfortably fits. This job just produces the
    # report tree + impact.json and hands them off as artifacts.
  artifacts:
    when: always
    paths:
      # The whole "after" tree: the freshly-generated reports the scorer re-scores, plus
      # edited-questions.txt (judge input) and the per-unit atx logs (spinner already
      # stripped at write time; the only record of what atx did, since the job log
      # carries just our concise markers so it can't hit the 4 MB cap again).
      # Literal path, NOT $AFTER_DIR: artifact globs are resolved by the runner, and a
      # silently-unexpanded variable here would just drop the artifact with no error.
      - harness/after/
      - impact.json
      - changed-severity.json   # which questions' severity the MR edited (differ gate input)
    expire_in: 30 days
  allow_failure: true   # advisory — never blocks the MR

# -----------------------------------------------------------------------------
# Entry 1b — harness:judge   (auto on MR; consumes harness:impact's artifacts)
# SCORE the freshly-generated reports for accuracy against the fixture source and
# classify each against the committed baseline, then run the LLM judge and post the
# advisory MR comment. Split out of harness:impact so it gets its OWN fresh credential
# vend: the impact job's atx execs can burn most of the chained-role session's hard 1h
# cap, leaving the Bedrock steps to die with ExpiredTokenException. This job starts
# fresh, needs no atx/Node (only boto3 + awscli), and finishes in seconds.
# -----------------------------------------------------------------------------
harness:judge:
  stage: judge
  rules:
    # Same gate as harness:impact: the judge has no impact.json to score without it and
    # calls Bedrock itself, so it needs the same creds. Skipped on a fork's detached
    # pipeline; runs when the MR is executed in the parent project. Keeping the two rules
    # identical means the `needs` below is always satisfiable.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $AWS_CREDS_TARGET_ROLE'
  needs:
    # optional: harness:impact shares this job's rule so it is normally present, but mark
    # the dependency optional so a future rule change can never turn a missing upstream
    # job into a pipeline-creation (YAML) error.
    - job: harness:impact
      artifacts: true
      optional: true
  # If harness:impact SKIPPED (denylisted diff) it produced no impact.json. Nothing to
  # judge — exit cleanly rather than erroring on the missing input.
  before_script:
    # No atx CLI, no Node: this job only re-scores JSON and calls Bedrock. Install just
    # git (for score-reports' repo-relative paths), curl (post-mr-comment.sh POSTs the
    # verdict to the GitLab API with it — without it the note silently fails HTTP 000),
    # awscli (identity check) and the Python deps (boto3 for the Bedrock call).
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git curl ca-certificates
    - pip install --quiet --cache-dir "$PIP_CACHE_DIR" awscli
    - if [ -f harness/requirements.txt ]; then pip install --quiet --cache-dir "$PIP_CACHE_DIR" -r harness/requirements.txt; fi
    # The pre-clone Credential Vendor has ALREADY vended a FRESH token into this job (see
    # the default before_script note). Confirm it so a missing/rejected role fails loudly.
    - export AWS_REGION="${AWS_REGION:-us-east-1}"
    - |
      if [ -n "${AWS_CREDS_TARGET_ROLE:-}" ]; then
        aws sts get-caller-identity >/dev/null 2>&1 \
          && echo "AWS Credential Vendor: fresh creds vended for role ${AWS_CREDS_TARGET_ROLE}" \
          || echo "WARN: creds not usable — scoring/judge will degrade to heuristic." >&2
      fi
  script:
    - |
      if [ ! -f impact.json ]; then
        echo "no impact.json from harness:impact (diff was denylisted, or the analyze job skipped) — nothing to judge."
        exit 0
      fi
    # SCORE (accuracy anchor): re-score the freshly-generated reports for groundedness
    # against the fixture SOURCE and classify each against the committed baseline
    # (improved / regressed / within-noise, with a per-fixture noise threshold). This is
    # the judge's only PAST DATA — without it the verdict is produced from the delta alone,
    # blind to where accuracy stood before the change. Advisory: `|| true` so a scoring
    # hiccup degrades the judge to delta-only rather than failing the job.
    - harness/score-reports.py --trees "$AFTER_DIR" --compare-out compare.json || true
    # JUDGE: LLM scores the delta against the contributor's INTENT (MR description, §6/§8.1).
    # --edited-questions tells the judge WHICH rubric questions the MR touched. Without it
    # the judge cannot separate the edit's effect from the analysis agent's run-to-run
    # nondeterminism (a same-rubric re-run moves 10-20 findings), and it read a
    # one-question change as "far broader than stated" -> a false `mismatch`.
    # --compare feeds the accuracy anchor above (absent file => judge falls back cleanly).
    - |
      EDITED=""
      [ -f "$AFTER_DIR/edited-questions.txt" ] && EDITED="$(cat "$AFTER_DIR/edited-questions.txt")"
      PROGRAMS=""
      [ -f "$AFTER_DIR/changed-programs.txt" ] && PROGRAMS="$(cat "$AFTER_DIR/changed-programs.txt")"
      harness/judge.py --impact impact.json --intent "$CI_MERGE_REQUEST_DESCRIPTION" \
        --edited-questions "$EDITED" --changed-programs "$PROGRAMS" --compare compare.json > verdict.json
    # REPORT: advisory MR comment (never blocks).
    - harness/post-mr-comment.sh verdict.json
  artifacts:
    when: always
    paths:
      - verdict.json
      - compare.json   # accuracy-vs-baseline anchor the judge scored against
    expire_in: 30 days
  allow_failure: true   # advisory — never blocks the MR

# -----------------------------------------------------------------------------
# Entry 2 — harness:full   (manual "Run pipeline" button; web-triggered only)
# For a full re-baseline (e.g. after publishing an approved change), or a forced re-run.
#
# THIS is the exhaustive sweep an MR deliberately does NOT do: every fixture in
# harness/usecases.yaml x 2 analyses (14 x 2 = 28 units today), ~110-130 agent-min each. A
# scoped 2-unit MR run measured 19 min wall-clock end to end, so a full sweep at RUN_JOBS=6
# is a few hours — hence the raised
# timeout. RUN_JOBS is higher than the MR's HARNESS_JOBS because wall-clock is the whole
# point here. Narrow with CHANGED_TD (ara|mod) to halve the work.
# -----------------------------------------------------------------------------
harness:full:
  stage: analyze
  rules:
    # Stand down on a re-baseline web run: harness:rebaseline (below) does the sweep AND
    # writes the baseline there, so without this guard a REBASELINE=true web pipeline fires
    # BOTH jobs — two multi-hour full sweeps, one of them pure redundant compute.
    - if: '$CI_PIPELINE_SOURCE == "web" && $REBASELINE == "true"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "web"'
  timeout: 12h           # default job timeout (1h) cannot fit a full sweep
  variables:
    CHANGED_TD: ""       # operator restricts to one TD's analysis type (optional)
    RUN_SCOPE: "all"     # "all", or a narrower scope understood by run-fixtures.sh
    RUN_INTENT: ""       # free-text intent handed to the judge (§6)
    RUN_JOBS: "6"        # concurrent atx execs — see HARNESS_JOBS note above
  script:
    - harness/run-fixtures.sh --scope "$RUN_SCOPE" --td "$CHANGED_TD" --validate --jobs "$RUN_JOBS"
    - harness/diff-reports.py --baseline harness/golden --after "$AFTER_DIR" -o impact.json
    # Accuracy anchor — see the note in harness:impact.
    - harness/score-reports.py --trees "$AFTER_DIR" --compare-out compare.json || true
    - harness/judge.py --impact impact.json --intent "$RUN_INTENT" --compare compare.json > verdict.json
    # No MR exists on a web pipeline -> fall back to printing the verdict.
    - harness/post-mr-comment.sh verdict.json || cat verdict.json
  artifacts:
    when: always
    paths:
      - impact.json
      - verdict.json
      - compare.json   # accuracy-vs-baseline anchor the judge scored against
      - harness/after/_logs/   # literal — see note on harness:impact
    expire_in: 30 days
  allow_failure: true   # advisory — never blocks

# -----------------------------------------------------------------------------
# Entry 3 — re-baseline   (scheduled weekly, or web-triggered reset)
# Keeps the committed baseline (harness/golden/ report trees + the accuracy
# baseline) FRESH so it never rots into the silent-stale trap the staleness
# guard exists to catch. Runs a full sweep against merged main, then proposes
# the refreshed baseline as an MR — the golden is reviewed like any change, not
# pushed silently to protected main.
#
# WHY IT IS SHARDED (harness:rebaseline-shard x N  ->  harness:rebaseline-gather):
#   The AWS Credential Vendor assumes our role via ROLE CHAINING, which AWS
#   hard-caps at 1 HOUR regardless of MaxSessionDuration. A full sweep is 28 units
#   (14 fixtures x 2 analyses) at ~110-130 agent-min each; even at RUN_JOBS=6 that
#   is ~2h wall-clock — so ONE job physically cannot finish before its own creds
#   expire. The first RESET run proved it: 21/28 units passed, then every later
#   exec died "security token expired", and the portfolio + golden write never ran.
#   The fix mirrors the harness:impact -> harness:judge split already in this file:
#   fan the per-repo sweep out across N PARALLEL shard jobs (GitLab `parallel:`),
#   each with its OWN fresh 1h vend and a disjoint ~1/N slice of the fixtures
#   (--shard $CI_NODE_INDEX/$CI_NODE_TOTAL) — each slice finishes well under the
#   hour. A single gather job (its own fresh vend) then runs the portfolio rollup
#   over the merged slices, writes golden, ratchet-checks, and opens the MR.
#
#   Shards deliberately do NOT --write-golden: a shard only holds its own slice, so
#   if it wrote golden it would carry the OLD committed baseline for every file it
#   did not freshen, and GitLab's artifact MERGE across the N parallel instances
#   could keep an old copy over a fresh one. Instead each shard uploads only its
#   slice under harness/after/, the gather job merges them (disjoint => clean
#   union), and ONLY the gather writes golden from the merged set.
#
# TWO MODES, chosen by REBASELINE_RESET (set on the gather):
#   - "false" (DEFAULT, scheduled): --ratchet. Adopt same-or-better numbers
#     freely; REFUSE (exit 3) if any fixture regressed beyond noise or fell below
#     the quality floor, so a degraded merge cannot silently enshrine itself as
#     the new "good" baseline. The scheduled cron runs this mode.
#   - "true" (web only): NO ratchet. For deliberately RESETTING a baseline that is
#     known-bad (e.g. the stale read-only loan-calculator golden, whose number is
#     high but WRONG — the correct new report reads as a "regression" against it,
#     so the ratchet would refuse it). A human triggers this and reviews the MR.
#
# Schedule it in Settings -> CI/CD -> Pipeline schedules (weekly, on main). The
# rules gate on $CI_PIPELINE_SOURCE == "schedule" so ONLY the cron (or a manual
# web run with REBASELINE=true) triggers it — never an MR or a normal push.
# -----------------------------------------------------------------------------
harness:rebaseline-shard:
  stage: analyze
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web" && $REBASELINE == "true"'
  # Fan the per-repo sweep out across 4 jobs. Each is a SEPARATE GitLab job with its own
  # pre-clone credential vend (fresh 1h), and runs the disjoint slice CI_NODE_INDEX/of/4.
  # 14 fixtures / 4 => 4/4/3/3 fixtures => ~6-8 units per shard: comfortably under the hour.
  # Bump this number if the fixture set grows enough that a slice again approaches ~45 min.
  parallel: 4
  # A shard's slice is ~6-8 units; 3h is generous headroom over the ~30-40 min it should
  # take, without letting a wedged atx exec burn a runner all day.
  timeout: 3h
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  variables:
    CHANGED_TD: ""       # restrict to one TD's analysis (ara|mod); empty = both
    RUN_JOBS: "6"        # concurrent atx execs WITHIN this shard — see harness:full
    REBASELINE: "true"   # web pipelines must opt in; schedule sets source=schedule
    REBASELINE_RESET: "false"  # "true" (web only) bypasses the ratchet in the GATHER job
  before_script:
    # Inherit the default before_script (Node + atx + AWS vend). No git identity needed —
    # a shard never commits; it only produces reports the gather job commits.
    - !reference [default, before_script]
  script:
    # Refuse a RESET on a scheduled pipeline — it bypasses the ratchet, so it must only ever
    # be a deliberate human web-trigger. Checked here too (not just the gather) so an unattended
    # cron misconfigured with REBASELINE_RESET=true fails FAST, before burning any atx minutes.
    - |
      if [ "$CI_PIPELINE_SOURCE" = "schedule" ] && [ "$REBASELINE_RESET" = "true" ]; then
        echo "REBASELINE_RESET=true is not allowed on a scheduled pipeline — it bypasses the" >&2
        echo "ratchet safety. Trigger a web pipeline with REBASELINE=true REBASELINE_RESET=true." >&2
        exit 1
      fi
    # This shard's disjoint slice of the full sweep. --shard implies --no-portfolio (the
    # rollup needs EVERY per-repo report, so it runs once in the gather job). NO --write-golden:
    # each shard uploads only its slice under harness/after/ and the gather writes golden from
    # the merged set (see the header note on the artifact-merge hazard). --validate contract-
    # checks each report as it lands.
    - harness/run-fixtures.sh --scope all --td "$CHANGED_TD" --shard "$CI_NODE_INDEX/$CI_NODE_TOTAL" --validate --jobs "$RUN_JOBS"
  artifacts:
    when: always
    paths:
      # This shard's per-repo report slice + its per-unit atx logs. The gather job's `needs`
      # merges all N shards' harness/after/ into one dir; slices are disjoint so it is a clean
      # union with no old-baseline contamination.
      - harness/after/
    expire_in: 30 days
  allow_failure: true   # advisory — a shard death must SURFACE (gather flags the gap), not block

harness:rebaseline-gather:
  stage: judge   # runs AFTER all shards (analyze stage) complete
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web" && $REBASELINE == "true"'
  # Merges every shard's slice (all N parallel instances) into one harness/after/ tree.
  needs:
    - job: harness:rebaseline-shard
      artifacts: true
  # Portfolio rollup (2 execs) + score + MR = well under the fresh 1h vend, but give headroom
  # for a slow portfolio exec.
  timeout: 3h
  variables:
    CHANGED_TD: ""             # must match the shards' value (ara|mod narrowing); empty = both
    RUN_JOBS: "6"
    REBASELINE: "true"
    REBASELINE_RESET: "false"  # "true" (web only) bypasses the ratchet for a known-bad reset
  before_script:
    # Inherit the default before_script (Node + atx + AWS vend — atx is needed for the
    # portfolio exec), then add git identity for the branch commit below.
    - !reference [default, before_script]
    - git config user.email "harness-bot@noreply.aws.dev"
    - git config user.name "harness re-baseline bot"
    # pytest is NOT in the default before_script (only awscli is). The self-test step below
    # runs the offline suite against the freshly written golden, so install the harness deps.
    - if [ -f harness/requirements.txt ]; then pip install --quiet --cache-dir "$PIP_CACHE_DIR" -r harness/requirements.txt; fi
  script:
    # Same fast RESET-on-schedule guard as the shards (defense in depth: this is where the
    # ratchet is actually bypassed).
    - |
      if [ "$CI_PIPELINE_SOURCE" = "schedule" ] && [ "$REBASELINE_RESET" = "true" ]; then
        echo "REBASELINE_RESET=true is not allowed on a scheduled pipeline — it bypasses the" >&2
        echo "ratchet safety. Trigger a web pipeline with REBASELINE=true REBASELINE_RESET=true." >&2
        exit 1
      fi
    # COMPLETENESS CHECK: the shards' merged slices should cover every fixture. A shard that
    # died (allow_failure) drops its slice, and --write-golden below would then leave those
    # fixtures on the STALE committed baseline while refreshing the rest — a silent partial
    # rebaseline, the exact rot this job exists to prevent. We can't cheaply fail (allow_failure
    # + a dead shard is a real possibility), so surface it LOUDLY and flag the MR as PARTIAL.
    - |
      REPORTS="$(find harness/after -maxdepth 1 -name '*-report.json' ! -name '*portfolio*' 2>/dev/null | wc -l | tr -d ' ')"
      FIXTURES="$(python3 -c 'import yaml; print(len(yaml.safe_load(open("harness/usecases.yaml")).get("fixtures",[])))')"
      # 2 reports (ara+mod) per fixture unless --td narrowed to one analysis.
      case "${CHANGED_TD:-}" in ara|mod|*readiness-analysis) EXPECT="$FIXTURES" ;; *) EXPECT="$((FIXTURES * 2))" ;; esac
      echo "gather: merged ${REPORTS} per-repo report(s) from the shards; expected ${EXPECT}."
      PARTIAL=""
      if [ "$REPORTS" -lt "$EXPECT" ]; then
        echo "⚠ PARTIAL SWEEP: a shard likely died — ${REPORTS}/${EXPECT} per-repo reports present." >&2
        echo "  golden will be refreshed only for the fixtures that ARE present; the rest keep the" >&2
        echo "  committed baseline. The MR is flagged PARTIAL so a reviewer knows not to trust it as" >&2
        echo "  a full re-baseline. Re-run the pipeline to get the missing shard(s)." >&2
        PARTIAL=" [PARTIAL]"
      fi
      echo "$PARTIAL" > .rebaseline-partial   # consumed by the MR title/body below
    # PORTFOLIO ROLLUP over the merged per-repo slices, then --write-golden to refresh the
    # golden tree from EVERYTHING now in harness/after (all per-repo slices + the fresh
    # portfolio reports). --portfolio-only skips stage 1 (already done by the shards) and the
    # clobber guard (the merged slices ARE its input, not an accidental re-run).
    - harness/run-fixtures.sh --scope all --td "$CHANGED_TD" --portfolio-only --write-golden --validate --jobs "$RUN_JOBS"
    # SELF-TEST the refreshed golden BEFORE proposing it. Several tests are coupled to golden's
    # content — they deep-copy real reports and assert on per-repo counts, tiers, and the
    # discovered repo set. A rebaseline that changes those (e.g. the 2026-08-11 reset moved
    # loan-calculator write-enabled and added the modern-* fixtures) left main red until the
    # tests were repaired by hand. Running the suite HERE, against the just-written golden,
    # turns that silent post-merge breakage into a loud pre-merge failure in the same job that
    # produced the baseline. A PARTIAL sweep is exempt: its golden is deliberately incomplete,
    # so a coverage-count failure would be expected noise, not the drift we're guarding.
    - |
      if [ -n "$(cat .rebaseline-partial 2>/dev/null || echo '')" ]; then
        echo "self-test: SKIPPED on a PARTIAL sweep (golden is intentionally incomplete)."
      else
        echo "self-test: running the offline suite against the freshly written golden…"
        set +e
        python3 -m pytest harness/tests/ -q
        RC=$?
        set -e
        if [ "$RC" != "0" ]; then
          echo "✗ SELF-TEST FAILED: the refreshed golden breaks the committed test suite." >&2
          echo "  This is drift between the fixture-coupled tests and the new baseline — the" >&2
          echo "  same class that left main red after the 2026-08-11 reset. The baseline is NOT" >&2
          echo "  proposed. Reproduce locally, update the coupled tests to match the new golden," >&2
          echo "  and land the test change and the rebaseline together in one MR." >&2
          exit "$RC"
        fi
      fi
    # Refresh the accuracy baseline from the refreshed golden. --ratchet unless this is a reset:
    # it refuses (exit 3) on a regression/below-floor sweep, leaving the committed baseline
    # untouched so we alert instead of enshrining a degradation. --compare-out captures the
    # comparison even on refusal for the alert.
    - |
      RATCHET="--ratchet"
      [ "$REBASELINE_RESET" = "true" ] && RATCHET="" && echo "RESET mode: ratchet DISABLED (human-reviewed reset)."
      set +e
      harness/score-reports.py --trees harness/golden --update-baseline $RATCHET --compare-out rebaseline-compare.json
      RC=$?
      set -e
      if [ "$RC" = "3" ]; then
        echo "✗ RATCHET refused: the fresh sweep is worse than the committed baseline (see above)." >&2
        echo "  The baseline was NOT changed. A merged change may have degraded the analysis." >&2
        echo "  Investigate, then re-baseline deliberately with a web run + REBASELINE_RESET=true." >&2
        exit 3
      elif [ "$RC" != "0" ]; then
        echo "score-reports.py failed (rc=$RC)" >&2; exit "$RC"
      fi
    # Nothing to propose if the sweep reproduced the committed baseline byte-for-byte.
    - |
      if git diff --quiet -- harness/golden harness/golden-accuracy-baseline.json; then
        echo "re-baseline reproduced the committed golden exactly — nothing to propose."
        exit 0
      fi
    # Propose the refreshed baseline as an MR (reviewed, never a silent push to main).
    # Needs HARNESS_MR_TOKEN (api scope, can push + open MRs); degrade to artifact-only.
    - |
      PARTIAL="$(cat .rebaseline-partial 2>/dev/null || echo '')"
      BR="rebaseline/$(date +%Y%m%d)-${CI_PIPELINE_ID}"
      # WHERE the refresh MR lands. A SCHEDULE (the weekly auto-rebaseline) always targets main —
      # that is the maintained baseline. But a CONTRIBUTOR who added a question can't merge to main
      # directly: their rubric edit lives on a feature branch, and its MR is red until the golden
      # answers the new question. So when a human triggers a web rebaseline ON their own branch, the
      # refresh MR targets THAT branch, not main — they merge the golden into their feature branch and
      # their original rubric MR goes green. This is the "I can't run atx locally" path (see
      # docs/contributing). Schedules and web runs on main keep targeting main.
      TARGET="main"
      if [ "$CI_PIPELINE_SOURCE" = "web" ] && [ "$CI_COMMIT_REF_NAME" != "main" ]; then
        TARGET="$CI_COMMIT_REF_NAME"
        echo "web rebaseline on branch '$TARGET' — the refresh MR will target that branch, not main."
      fi
      if [ -z "${HARNESS_MR_TOKEN:-}" ]; then
        echo "no HARNESS_MR_TOKEN — cannot open an MR. The refreshed baseline is attached as" >&2
        echo "an artifact; download it and open the MR by hand." >&2
        exit 0
      fi
      git checkout -b "$BR"
      git add harness/golden harness/golden-accuracy-baseline.json
      git commit -m "chore(harness): re-baseline ($(date +%Y-%m-%d)) → ${TARGET}${PARTIAL}" \
                 -m "Automated by harness:rebaseline-gather (pipeline ${CI_PIPELINE_ID}, source ${CI_PIPELINE_SOURCE}, reset=${REBASELINE_RESET}, target ${TARGET}). Sharded sweep across ${CI_NODE_TOTAL:-N} shards. Ratchet-checked unless reset. Review the score deltas in rebaseline-compare.json before merging.${PARTIAL:+ WARNING: PARTIAL sweep — a shard dropped its slice; some fixtures kept the stale baseline. Do NOT merge as a full re-baseline; re-run first.}"
      git push "https://oauth2:${HARNESS_MR_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" \
               "$BR" -o merge_request.create -o "merge_request.target=${TARGET}" \
               -o merge_request.title="chore(harness): re-baseline $(date +%Y-%m-%d) → ${TARGET}${PARTIAL}" \
               -o merge_request.remove_source_branch
      echo "pushed $BR and opened an MR to ${TARGET}."
  artifacts:
    when: always
    paths:
      - rebaseline-compare.json          # score deltas vs the outgoing baseline
      - harness/golden/                  # the refreshed report trees (for hand-review)
      - harness/golden-accuracy-baseline.json
      - harness/after/_logs/
    expire_in: 30 days
  allow_failure: true   # a refused ratchet (exit 3) must SURFACE, not block other work

# -----------------------------------------------------------------------------
# harness:scorer-sync   (auto on any MR that touches the TD or the sync sources)
# Regenerate the EXTERNAL Optimus scorer prompts from the TD and COMMIT THEM BACK
# to the MR branch, so a contributor who edits a severity/count/tier never has to
# remember to run `scorer-prompt-sync.py --write` by hand.
#
# WHY A COMMIT-BACK AND NOT JUST A RED GATE
# harness:contract-tests already runs test_committed_prompts_are_in_sync_with_the_td
# on every MR — that is the drift *detector*. It fails red when the TD moved but the
# prompt didn't, telling the contributor to run --write. This job is the *fixer*: it
# runs --write for them and pushes the result onto their branch, turning that red into
# a green with no manual step (offline, seconds — pure TD parse + render).
#
# THE ONE THING THIS MUST NOT DO is silently swallow the "re-publish to Optimus" signal.
# Regenerating the in-repo .md is only half the job — the Optimus platform serves a COPY
# of that prompt, and nothing here can push to it. So when this job commits a change it
# shouts (job log + a persistent MR note + the commit message) that a human MUST re-publish
# the regenerated prompt to Optimus. The committed file is the record; the note is the nag.
#
# LOOP SAFETY: the bot's commit touches only harness/rubric/*-scorer-prompt.md and
# *-scorer-facts.lock.json. Neither is in this job's `changes:` trigger (which watches the
# TD + the derivation sources), so the auto-commit does NOT re-run this job. It also cannot
# re-trigger the expensive harness:impact sweep — should-run.sh denylists both paths.
# -----------------------------------------------------------------------------
harness:scorer-sync:
  stage: test
  rules:
    # Only when something that FEEDS derive_facts changed: the two managed TDs (SKILL.md +
    # references/) or the derivation code itself. Deliberately excludes the generated
    # prompt .md and the lock .json, so the bot's own commit-back never re-triggers this job.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - definitions/managed/agentic-readiness-analysis/**/*
        - definitions/managed/modernization-readiness-analysis/**/*
        - harness/skill_table.py
        - harness/score-reports.py
        - harness/scorer-prompt-sync.py
  before_script:
    # Offline: no atx, no Node, no AWS vend. git (to commit + push back) + curl (to post the
    # re-publish MR note) + the harness Python deps (skill_table parses the TD with PyYAML).
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git curl ca-certificates
    - if [ -f harness/requirements.txt ]; then pip install --quiet --cache-dir "$PIP_CACHE_DIR" -r harness/requirements.txt; fi
    - git config user.email "harness-bot@noreply.aws.dev"
    - git config user.name "harness scorer-sync bot"
  script:
    # A fork MR runs in the fork's project, and HARNESS_MR_TOKEN cannot push to a fork
    # branch. There is nothing to commit back to, so leave the (already-red) contract-test
    # as the fork contributor's signal to run --write themselves, and exit cleanly.
    - |
      if [ -n "${CI_MERGE_REQUEST_SOURCE_PROJECT_ID:-}" ] \
         && [ "${CI_MERGE_REQUEST_SOURCE_PROJECT_ID}" != "${CI_PROJECT_ID}" ]; then
        echo "fork MR (source project ${CI_MERGE_REQUEST_SOURCE_PROJECT_ID} != ${CI_PROJECT_ID}) —" >&2
        echo "cannot push a commit back to a fork branch. Run 'python3 harness/scorer-prompt-sync.py" >&2
        echo "--write' locally, commit, and re-publish the prompt to Optimus." >&2
        exit 0
      fi
    # Work on the SOURCE-branch tip, not the detached merge-result HEAD, so what we regenerate
    # and push is exactly the contributor's branch content (no target-branch bleed-in).
    - |
      SRC="${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME:-$CI_COMMIT_REF_NAME}"
      git fetch --quiet origin "$SRC"
      git checkout -B "$SRC" "origin/$SRC"
    # Regenerate the GEN blocks + rewrite the facts-lock from the live TD.
    - python3 harness/scorer-prompt-sync.py --write
    # Commit back ONLY if --write actually changed something. If the contributor already ran
    # --write (or the TD edit didn't touch a baked-in fact), there is nothing to do — same
    # "reproduced byte-for-byte, nothing to propose" guard the rebaseline job uses.
    - |
      RUBRIC="harness/rubric/ara-scorer-prompt.md harness/rubric/mod-scorer-prompt.md \
              harness/rubric/ara-scorer-facts.lock.json harness/rubric/mod-scorer-facts.lock.json"
      if git diff --quiet -- $RUBRIC; then
        echo "scorer prompts already in sync with the TD — nothing to commit."
        exit 0
      fi
      echo "=============================================================================="
      echo "TD drift regenerated the EXTERNAL Optimus scorer prompt(s):"
      git --no-pager diff --stat -- $RUBRIC
      echo "=============================================================================="
      if [ -z "${HARNESS_MR_TOKEN:-}" ]; then
        echo "✗ no HARNESS_MR_TOKEN — cannot push the regenerated prompt back to the branch." >&2
        echo "  Run 'python3 harness/scorer-prompt-sync.py --write', commit, and re-publish to" >&2
        echo "  Optimus by hand. (Settings -> CI/CD -> Variables: a Project Access Token with" >&2
        echo "  'api' scope, Reporter or above, Masked ok, Protected OFF.)" >&2
        exit 1
      fi
      SRC="${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME:-$CI_COMMIT_REF_NAME}"
      git add $RUBRIC
      git commit -m "chore(harness): auto-sync Optimus scorer prompt to the TD" \
        -m "Regenerated by harness:scorer-sync (pipeline ${CI_PIPELINE_ID}) because this MR moved a TD fact the external scorer bakes in. ACTION REQUIRED: the Optimus platform serves a COPY of this prompt — re-publish the regenerated harness/rubric/*-scorer-prompt.md there, or the benchmark scorer stays stale."
      git push "https://oauth2:${HARNESS_MR_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" \
               "HEAD:${SRC}"
      echo "pushed the regenerated scorer prompt onto ${SRC}."
    # LOUD, PERSISTENT nag: the commit fixed the in-repo copy, but a human still has to
    # re-publish to Optimus. An MR note survives after the job log scrolls away. Advisory —
    # a failed POST must not fail the job (the commit is already the durable record).
    - |
      if [ -n "${CI_MERGE_REQUEST_IID:-}" ] && [ -n "${HARNESS_MR_TOKEN:-}" ]; then
        # printf keeps every source line indented (so the YAML block scalar stays intact)
        # while emitting real newlines, so the rendered markdown has no stray code-block
        # indentation. Blank "" args are the paragraph breaks.
        BODY="$(printf '%s\n' \
          "⚠️ **Scorer prompt auto-synced to the TD — action required.**" \
          "" \
          "This MR moved a TD fact that the **external Optimus scorer prompt** bakes in, so \`harness:scorer-sync\` regenerated \`harness/rubric/*-scorer-prompt.md\` (+ the facts-lock) and committed it to this branch." \
          "" \
          "**The in-repo copy is now correct, but the Optimus platform still serves the OLD prompt.** Before/after merge, re-publish the regenerated prompt to Optimus, or the benchmark scorer keeps grading against stale rubric facts. This note is the only signal that a re-publish is owed — it is not automated.")"
        curl -sS --max-time 30 \
          --header "PRIVATE-TOKEN: ${HARNESS_MR_TOKEN}" \
          --data-urlencode "body=${BODY}" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${CI_MERGE_REQUEST_IID}/notes" \
          >/dev/null && echo "posted the re-publish reminder to MR !${CI_MERGE_REQUEST_IID}." \
          || echo "WARN: could not post the re-publish MR note (the commit still landed)." >&2
      fi
  allow_failure: true   # advisory — mirrors the rest of the harness; never blocks a merge
