AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >-
  Payments API — serverless, contract-first, idempotent. Every function has a
  least-privilege role scoped to exactly the table actions it needs.

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]
    Timeout: 15
    MemorySize: 256
    Tracing: Active
    Environment:
      Variables:
        LEDGER_TABLE: !Ref LedgerTable
        IDEMPOTENCY_TTL_SECONDS: '86400'
        POWERTOOLS_SERVICE_NAME: payments
        LOG_LEVEL: INFO

Resources:
  LedgerTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      TimeToLiveSpecification: { AttributeName: ttl, Enabled: true }
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
      SSESpecification: { SSEEnabled: true }

  PaymentsApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: v1
      TracingEnabled: true
      Auth:
        DefaultAuthorizer: OAuth2Authorizer
        Authorizers:
          OAuth2Authorizer:
            FunctionArn: !GetAtt AuthorizerFunction.Arn
      # Callers reach the API only through the custom domain, which terminates TLS 1.2+
      # with an ACM certificate. The raw execute-api endpoint is not published.
      Domain:
        DomainName: !Ref ApiDomainName
        CertificateArn: !Ref ApiCertificateArn
        EndpointConfiguration: REGIONAL
        SecurityPolicy: TLS_1_2
      DefinitionBody:
        Fn::Transform:
          Name: AWS::Include
          Parameters: { Location: ../openapi/payments.yaml }

  ChargesFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: payments.handlers.create_charge
      CodeUri: ../src
      Policies:
        - DynamoDBWritePolicy: { TableName: !Ref LedgerTable }
        - DynamoDBReadPolicy: { TableName: !Ref LedgerTable }
      Events:
        CreateCharge:
          Type: Api
          Properties: { RestApiId: !Ref PaymentsApi, Path: /charges, Method: post }

  RefundsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: payments.handlers.refund_charge
      CodeUri: ../src
      Policies:
        - DynamoDBWritePolicy: { TableName: !Ref LedgerTable }
        - DynamoDBReadPolicy: { TableName: !Ref LedgerTable }
      Events:
        RefundCharge:
          Type: Api
          Properties:
            RestApiId: !Ref PaymentsApi
            Path: /charges/{chargeId}/refunds
            Method: post

  # Settlement receipts. KMS-encrypted at rest and reachable only over TLS — the bucket
  # policy denies any request that arrives without it, and any TLS below 1.2.
  ReceiptsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
            BucketKeyEnabled: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled

  ReceiptsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ReceiptsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyNonTlsRequests
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt ReceiptsBucket.Arn
              - !Sub '${ReceiptsBucket.Arn}/*'
            Condition:
              Bool:
                'aws:SecureTransport': 'false'
          - Sid: DenyOutdatedTlsVersions
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt ReceiptsBucket.Arn
              - !Sub '${ReceiptsBucket.Arn}/*'
            Condition:
              NumericLessThan:
                's3:TlsVersion': '1.2'

  AuthorizerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: payments.authorizer.handler
      CodeUri: ../src
      # Validates OAuth2 client-credentials tokens against Cognito; no static keys.
      Environment:
        Variables:
          COGNITO_USER_POOL_ID: !Ref UserPoolId

Parameters:
  UserPoolId:
    Type: String
    Description: Cognito user pool that issues client-credentials tokens.

  ApiDomainName:
    Type: String
    Description: Custom domain clients call, e.g. payments.example.com.

  ApiCertificateArn:
    Type: String
    Description: >-
      ACM certificate for ApiDomainName. Regional API Gateway custom domains require
      the certificate in this stack's region.
    AllowedPattern: '^arn:aws[a-zA-Z-]*:acm:[a-z0-9-]+:\d{12}:certificate/.+$'

Outputs:
  ApiUrl:
    Description: Public HTTPS endpoint (TLS 1.2 minimum, ACM certificate).
    Value: !Sub 'https://${ApiDomainName}/v1'
