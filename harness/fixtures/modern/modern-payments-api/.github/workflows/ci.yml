name: ci
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -e '.[dev]'
      - run: ruff check src tests
      - run: mypy src
      - run: python -c "from openapi_spec_validator import validate; import yaml; validate(yaml.safe_load(open('openapi/payments.yaml')))"
      - run: pytest -q
