[project]
name = "modern-payments-api"
version = "1.4.0"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.34",
    "aws-lambda-powertools>=2.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "openapi-spec-validator>=0.7",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
