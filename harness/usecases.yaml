# Change-Impact Harness — use-case matrix
#
# Each fixture is a real repo the managed TDs are exercised against. `axes` drive the
# coverage heatmap (coverage-heatmap.py); `expectations` are the baseline the judge
# scores the observed delta against (diff-reports.py + judge.py). See harness/DESIGN.md §4.
#
# Axis vocab (keep these closed so the heatmap can flag gaps):
#   language:     vb6 | coldfusion | python | java | cobol | cpp | nodejs | ruby | vbnet | php
#   era:          legacy | modern
#   has_iac:      true | false
#   has_api:      none | rest | soap | graphql | rpc
#   architecture: monolith | service | desktop | batch | script | serverless
#   auth_present: true | false | partial
#   persistence:  none | sql | nosql | file | mainframe-dataset
#
# expectations are per applicable TD. ARA applies to every fixture; MOD applies to every
# fixture. Tiers/pathways/scores use the exact vocab emitted by the reports (DESIGN.md §2-3).
# These are INTENT baselines for the judge, not asserted equalities — the differ reports the
# real delta and the judge weighs it against these + the contributor's stated intent.

version: 1

# ---------------------------------------------------------------------------
# Axis definitions — the closed vocab the heatmap checks coverage against.
# Adding a value here without a fixture that uses it => the heatmap flags a gap.
# ---------------------------------------------------------------------------
axes:
  language:     [vb6, coldfusion, python, java, cobol, cpp, nodejs, ruby, vbnet, php]
  era:          [legacy, modern]
  has_iac:      [true, false]
  has_api:      [none, rest, soap, graphql, rpc]
  architecture: [monolith, service, desktop, batch, script, serverless]
  auth_present: [true, false, partial]
  persistence:  [none, sql, nosql, file, mainframe-dataset]

# ---------------------------------------------------------------------------
# Fixtures — the actual repos analysis runs against.
# ---------------------------------------------------------------------------
fixtures:
  - id: legacy-crm-desktop
    path: harness/fixtures/portfolio/legacy-crm-desktop
    axes: { language: vb6, era: legacy, has_iac: false, has_api: none,
            architecture: desktop, auth_present: false, persistence: file }
    notes: >-
      VB6 thick-client with MS Access backend. Hardcoded DB password, string-concat SQL,
      On Error Resume Next. Hard to containerize — not a server app.
    expectations:
      ara:
        tier: Not Agent-Integrable        # desktop, no machine interface
        must_have_categories: [AUTH, API, DISC]
      mod:
        tier: Not Ready
        must_have_categories: [APP, SEC]
        pathways_triggered: [move-to-cloud-native]
        overall_score_band: Not Ready

  - id: legacy-document-portal
    path: harness/fixtures/portfolio/legacy-document-portal
    axes: { language: coldfusion, era: legacy, has_iac: false, has_api: none,
            architecture: monolith, auth_present: true, persistence: sql }
    notes: >-
      ColdFusion 8 intranet. Session auth present but SQL injection + documented path
      traversal in download.cfm.
    expectations:
      ara:
        tier: Remediation Required
        must_have_categories: [AUTH, DATA, DISC]
      mod:
        tier: Remediation Required
        must_have_categories: [APP, SEC]
        pathways_triggered: [move-to-cloud-native, move-to-open-source]
        overall_score_band: Needs Work

  - id: legacy-helpdesk-tickets
    path: harness/fixtures/portfolio/legacy-helpdesk-tickets
    axes: { language: python, era: legacy, has_iac: false, has_api: rest,
            architecture: monolith, auth_present: true, persistence: sql }
    notes: >-
      Django 1.4 / Python 2.7 (EOL). Raw SQL string-formatting, DEBUG=True in prod,
      committed SECRET_KEY + plaintext DB password.
    expectations:
      ara:
        tier: Remediation Required
        must_have_categories: [AUTH, API, OBS]
      mod:
        tier: Remediation Required
        must_have_categories: [APP, SEC, OPS]
        pathways_triggered: [move-to-cloud-native, move-to-open-source]
        overall_score_band: Needs Work

  - id: legacy-loan-calculator
    path: harness/fixtures/portfolio/legacy-loan-calculator
    axes: { language: java, era: legacy, has_iac: false, has_api: rest,
            architecture: service, auth_present: partial, persistence: sql }
    notes: >-
      Struts 1.3 (EOL framework), Java 5. Container-managed auth (getRemoteUser),
      hardcoded Oracle creds, string-built INSERT.
    expectations:
      ara:
        tier: Remediation Required
        must_have_categories: [AUTH, STATE, API]
      mod:
        tier: Remediation Required
        must_have_categories: [APP, SEC]
        pathways_triggered: [move-to-open-source, move-to-cloud-native]
        overall_score_band: Needs Work

  - id: legacy-partner-soap
    path: harness/fixtures/portfolio/legacy-partner-soap
    axes: { language: java, era: legacy, has_iac: false, has_api: soap,
            architecture: service, auth_present: false, persistence: sql }
    notes: >-
      JAX-WS SOAP, WSDL drifts from impl. XXE, SQL injection from parsed XML, raw
      exceptions returned, no real authN (partnerId only).
    expectations:
      ara:
        tier: Remediation Required
        must_have_categories: [AUTH, API, DATA]
      mod:
        tier: Remediation Required
        must_have_categories: [APP, SEC, DATA]
        pathways_triggered: [move-to-cloud-native, move-to-open-source]
        overall_score_band: Needs Work

  - id: legacy-payroll-system
    path: harness/fixtures/portfolio/legacy-payroll-system
    axes: { language: cobol, era: legacy, has_iac: false, has_api: none,
            architecture: batch, auth_present: false, persistence: mainframe-dataset }
    notes: >-
      COBOL + JCL on z/OS, CA-7 scheduled. Hardcoded FTP creds, plaintext transfer,
      handles SSN/bank data. Hardest modernization target.
    expectations:
      ara:
        tier: Not Agent-Integrable        # batch mainframe, no machine interface
        must_have_categories: [API, DISC, OBS]
      mod:
        tier: Not Ready
        must_have_categories: [APP, INF, SEC]
        pathways_triggered: [move-to-cloud-native]
        overall_score_band: Not Ready

  - id: legacy-pricing-cgi
    path: harness/fixtures/portfolio/legacy-pricing-cgi
    axes: { language: cpp, era: legacy, has_iac: true, has_api: rest,
            architecture: script, auth_present: false, persistence: file }
    notes: >-
      C++ CGI with k8s + Dockerfile wrapper (only C++ + IaC fixture). Buffer overflow
      via strcpy, reflected XSS, requires GCC 3.4.
    expectations:
      ara:
        tier: Remediation Required
        must_have_categories: [AUTH, API, OBS]
      mod:
        tier: Remediation Required
        must_have_categories: [APP, SEC, INF]
        pathways_triggered: [move-to-containers, move-to-cloud-native]
        overall_score_band: Needs Work

  - id: legacy-shipping-api
    path: harness/fixtures/portfolio/legacy-shipping-api
    axes: { language: nodejs, era: legacy, has_iac: true, has_api: rest,
            architecture: service, auth_present: true, persistence: nosql }
    notes: >-
      Node 0.10 / Express 3 (EOL) with k8s + Dockerfile. Static API key, Mongo w/ no
      auth, NoSQL injection. Also the Dependabot fixture.
    expectations:
      ara:
        tier: Remediation Required
        must_have_categories: [AUTH, API, DATA]
      mod:
        tier: Remediation Required
        must_have_categories: [APP, SEC, INF]
        pathways_triggered: [move-to-containers, move-to-managed-databases]
        overall_score_band: Needs Work

  - id: legacy-storefront-rails
    path: harness/fixtures/portfolio/legacy-storefront-rails
    axes: { language: ruby, era: legacy, has_iac: false, has_api: rest,
            architecture: monolith, auth_present: partial, persistence: sql }
    notes: >-
      Rails 2.3 / Ruby 1.8.7 (EOL). SQL injection, mass-assignment, PCI concern (card
      data from checked-in config), auth missing on some actions.
    expectations:
      ara:
        tier: Remediation Required
        must_have_categories: [AUTH, DATA, STATE]
      mod:
        tier: Remediation Required
        must_have_categories: [APP, SEC]
        pathways_triggered: [move-to-open-source, move-to-cloud-native]
        overall_score_band: Needs Work

  - id: legacy-timesheet-webforms
    path: harness/fixtures/portfolio/legacy-timesheet-webforms
    axes: { language: vbnet, era: legacy, has_iac: false, has_api: none,
            architecture: monolith, auth_present: true, persistence: sql }
    notes: >-
      ASP.NET WebForms 2.0 / VB.NET. Plaintext connection string, debug=true in prod,
      Forms auth without SSL, string-concat SQL.
    expectations:
      ara:
        tier: Remediation Required
        must_have_categories: [AUTH, API, DISC]
      mod:
        tier: Remediation Required
        must_have_categories: [APP, SEC]
        pathways_triggered: [move-to-cloud-native, move-to-open-source]
        overall_score_band: Needs Work

  # --- Modern fixtures: exercise the tiers the 11 legacy fixtures never reach ------
  # Every legacy fixture above lands Not Agent-Integrable / Remediation Required (ARA)
  # and Not Ready / Needs Work (MOD). These three are era:modern and graduate cleanly,
  # so the blockers==0 half of the ARA tier arithmetic and the MOD Partial/Mature bands
  # finally run on a real fixture. They also fill three heatmap gaps: era:modern,
  # architecture:serverless, and has_api:graphql (previously zero fixtures each).
  - id: modern-payments-api
    path: harness/fixtures/modern/modern-payments-api
    axes: { language: python, era: modern, has_iac: true, has_api: rest,
            architecture: serverless, auth_present: true, persistence: nosql }
    notes: >-
      Python 3.12 serverless payments (Lambda + API Gateway + DynamoDB). OpenAPI 3.1
      contract, OAuth2 client-credentials machine auth, per-write Idempotency-Key,
      structured logs + X-Ray, least-privilege IAM, append-only ledger, tests + runbook.
      The gold-standard target: no blockers, machine-drivable end to end.
    expectations:
      ara:
        tier: Agent-Ready                 # machine interface + auth + idempotency, 0 blockers
        must_have_categories: [AUTH, API, OBS]
      mod:
        tier: Mature
        must_have_categories: [APP, SEC, OPS]
        pathways_triggered: []            # already cloud-native serverless
        overall_score_band: Mature

  - id: modern-orders-service
    path: harness/fixtures/modern/modern-orders-service
    axes: { language: nodejs, era: modern, has_iac: true, has_api: rest,
            architecture: service, auth_present: true, persistence: sql }
    notes: >-
      Node 20 / TypeScript / Fastify on ECS Fargate + RDS. Clean, typed, JWT-authed,
      IaC-deployed — but DELETE hard-deletes PII, refund has no idempotency key, and
      cancel recalls a physical dispatch, all with NO human-in-the-loop. Well-built app,
      unsafe to drive UNATTENDED: expect >=3 RISK-SAFETY findings but 0 hard blockers.
    expectations:
      ara:
        tier: Pilot-Ready                 # 0 blockers, but >=3 safety concerns -> "Safety Concerns"
        safety_qualifier: true            # the spurious/missing-safety-qualifier checks exercise this
        must_have_categories: [AUTH, API, STATE]
      mod:
        tier: Partial
        must_have_categories: [APP, SEC, OPS]
        pathways_triggered: []
        overall_score_band: Partial

  - id: modern-catalog-graphql
    path: harness/fixtures/modern/modern-catalog-graphql
    axes: { language: nodejs, era: modern, has_iac: true, has_api: graphql,
            architecture: serverless, auth_present: true, persistence: nosql }
    notes: >-
      Node 20 / TypeScript / Apollo Server 4 GraphQL (Lambda + DynamoDB). Schema-first,
      JWT + scope checks, upsert-by-SKU (idempotent writes), soft-delete. Only minor
      hardening gaps (no query depth limit; delete lacks an audit event) — no irreversible
      destructive path, no missing auth. Lands Pilot-Ready with routine hardening, NOT a
      safety qualifier (the gaps are availability/audit, not unsafe autonomous actions).
    expectations:
      ara:
        tier: Pilot-Ready                 # 0 blockers, 0-2 safety concerns -> no qualifier
        safety_qualifier: false
        must_have_categories: [API, AUTH, OBS]
      mod:
        tier: Partial
        must_have_categories: [APP, SEC]
        pathways_triggered: []
        overall_score_band: Partial

  - id: monolith-php
    path: harness/fixtures/monolith
    axes: { language: php, era: legacy, has_iac: true, has_api: rest,
            architecture: monolith, auth_present: true, persistence: sql }
    notes: >-
      Single 3,192-line index.php, ~20 /api routes via preg_match. Real bcrypt auth but
      seeded default creds. docker-compose + CloudFormation App Runner. Prime
      decompose-the-monolith candidate. No README.
    expectations:
      ara:
        tier: Remediation Required
        must_have_categories: [API, STATE, DISC]
      mod:
        tier: Remediation Required
        must_have_categories: [APP, INF, OPS]
        pathways_triggered: [move-to-cloud-native, move-to-modern-devops]
        overall_score_band: Needs Work

# ---------------------------------------------------------------------------
# Portfolio-level expectations — programs (D4) are PORTFOLIO-only, on BOTH ARA and MOD.
# Pathways/scores at portfolio level are MOD-only. See DESIGN.md §3.
# The portfolio is the union of all fixtures above.
# ---------------------------------------------------------------------------
portfolio_expectations:
  ara:
    # D4: ARA portfolio recommended_actions[] (acronym/type/status)
    programs_expected: [AI DLC, AXE, EBA]
  mod:
    # D3: portfolio pathways[].portfolio_status == Triggered
    pathways_triggered: [move-to-cloud-native, move-to-open-source, move-to-containers,
                         move-to-managed-databases, move-to-modern-devops]
    # D4: MOD portfolio recommended_actions[] + pathways[].recommended_aws_programs
    programs_expected: [EBA, MAP, OLA]
    # D5: portfolio_overall_score band
    portfolio_score_band: Needs Work
